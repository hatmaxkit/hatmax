codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "40...100"

  status:
    project:
      default:
        target: 40%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 40%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tmp/**/*"
  - "build/**/*"
  - "**/*_test.go"
