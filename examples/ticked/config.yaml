log:
  level: info

server:
  port: ":8080"
  host: localhost

database:
  host: localhost
  port: 5432
  user: dev
  password: dev
  database: tickedhm
  sslmode: disable
  schema: public

auth:
  session_recent_proof_age: "5m"
  session_max_per_subject: 10
  session_page_size: 50
  session_ttl: "24h"
  session_inactivity_ttl: "30m"
  session_activity_interval: "1m"
  session_timeout: "5s"
  session_cleanup_batch: 1000
  password_min_len: 15
  password_max_len: 1024
  password_max_bytes: 4096
  password_check_timeout: 2s
  password_timeout: 5s
  argon_memory_kib: 65536
  argon_iterations: 3
  argon_parallelism: 4
  argon_max_memory_kib: 65536
  argon_max_iterations: 3
  argon_max_parallelism: 4
  password_max_concurrent: 2

authenticator:
  rp_id: localhost
  rp_name: Ticked
  origins:
    - http://localhost:8080
  localhost_development: true
  pending_ttl: 5m
  recent_proof_age: 5m
  timeout: 5s
  lease: 5s
  budget_window: 15m
  cooldown: 15m
  max_pending: 5
  max_authenticators: 10
  pending_attempts: 5
  subject_attempts: 10
  max_concurrent: 2
  cleanup_batch: 1000
