version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "assets/migration/postgres"
    gen:
      go:
        package: "dal"
        out: "internal/dal"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
