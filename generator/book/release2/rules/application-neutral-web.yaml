id: hatmax.application.neutral_web
level: required
title: Neutral server-rendered web surface
rationale: The initial application should prove canonical routing, rendering, and assets without inventing a business domain.
applies_when:
  - the application archetype is selected
requires:
  - a neutral landing page uses the canonical router, templates, and embedded assets
prohibits:
  - invented domain models, JSON-first APIs, or client-side application state
diagnostics:
  - HMGEN-APPLICATION-NEUTRAL-WEB
archetypes:
  - server_rendered_hatmax_application
